[project]
name = "core-python"
version = "0.1.0"
description = "Core Python modules for personal-color-kr (funnel, scan_option, personal_color, retention, image_edit, content)"
requires-python = ">=3.11"
dependencies = [
    # `python-dotenv` powers the `config.env` helpers that resolve the root
    # `.env` file via `find_dotenv()`. It is a build-time dependency (not an
    # optional dev tool) because production smoke scripts such as
    # `scripts/smoke_fal.py` import the helper at runtime to discover keys.
    "python-dotenv>=1.0",
    # `httpx` is the synchronous HTTP transport used by the Fal.ai vendor
    # adapter (`image_edit.fal_ai_vendor_caller`). It is imported by
    # production source — not just tests — so it must be a runtime dep.
    "httpx>=0.27",
    # `Pillow` is the single image-decoding dependency used by the
    # Phase 0.x personal-color runtime entry point. Its production import
    # is isolated to `personal_color.image_decoder`; no other source file
    # may import PIL. Kept as a runtime dep (not a dev tool) because the
    # production `diagnose_personal_color` call path resolves a Pillow
    # decoder by default.
    "Pillow>=10.0",
    # `mediapipe` is the single face-detection dependency used by the
    # Phase 0.x personal-color runtime entry point. Its production import
    # is isolated to `personal_color.face_detector` (lazy-loaded on the
    # first detection call, not at module import time). Pinned exactly
    # at 0.10.18 so the diagnosis result is deterministic for a given
    # selfie payload — the same exact-pin pattern used for httpx>=0.27
    # in the Phase 3.1 vendor caller's contract.
    "mediapipe==0.10.18",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast, no I/O",
    "integration: cross-module / external I/O",
]

[tool.black]
# Pin formatting target to the Seed's stated minimum runtime
# (`Python >= 3.12`) so black does not silently emit syntax the CI
# runner (Python 3.12 per `.github/workflows/ci.yml`) can't parse.
target-version = ["py312"]
# The five Phase 0.x source files below are the immutable diagnosis
# primitives that the Phase 0.x runtime wiring task (Sub-AC 12) must
# leave untouched per the Seed constraint:
#
#   "Zero changes to existing Phase 0.x files (region_extractor.py,
#    diagnosis_orchestrator.py, season_classifier.py,
#    tone_classifier.py, contrast_classifier.py)"
#
# Excluding them from black keeps the constraint literal — they retain
# their existing formatting bit-for-bit — while still letting
# `black --check` pass cleanly across the rest of the codebase
# (four_tool_green exit condition).
force-exclude = '''
(
    src/personal_color/region_extractor\.py
  | src/personal_color/diagnosis_orchestrator\.py
  | src/personal_color/season_classifier\.py
  | src/personal_color/tone_classifier\.py
  | src/personal_color/contrast_classifier\.py
)
'''
