[project]
name = "core-python"
version = "0.1.0"
description = "Core Python modules for personal-color-kr (funnel, scan_option, personal_color, retention, image_edit, content)"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast, no I/O",
    "integration: cross-module / external I/O",
]
