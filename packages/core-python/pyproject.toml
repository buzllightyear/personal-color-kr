[project]
name = "core-python"
version = "0.1.0"
description = "Core Python modules for personal-color-kr (funnel, scan_option, personal_color, retention, image_edit, content)"
requires-python = ">=3.11"
dependencies = [
    # `python-dotenv` powers the `config.env` helpers that resolve the root
    # `.env` file via `find_dotenv()`. It is a build-time dependency (not an
    # optional dev tool) because production smoke scripts such as
    # `scripts/smoke_fal.py` import the helper at runtime to discover keys.
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: fast, no I/O",
    "integration: cross-module / external I/O",
]
