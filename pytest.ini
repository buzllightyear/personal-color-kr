[pytest]
# Root-level pytest configuration for the monorepo.
#
# `apps/api/tests` and `packages/core-python/tests` are BOTH Python packages
# named `tests` (each has its own `__init__.py`). Under pytest's default
# "prepend" import mode, the first `tests` package loaded wins in
# `sys.modules`, so submodules of the second package (e.g. `tests.config`,
# `tests.content`) fail to import with `ModuleNotFoundError`.
#
# `importlib` import mode imports each test module under a unique, fully
# rooted module name and never inserts the package into `sys.modules` under
# the bare `tests` name, eliminating the collision. Each package still keeps
# its own `pyproject.toml [tool.pytest.ini_options]` for runs launched from
# inside that package directory; this file only governs root-level runs.
addopts = --import-mode=importlib
asyncio_mode = auto
markers =
    unit: fast, no I/O
    integration: cross-module / external I/O (real Postgres, real MediaPipe, real Pillow)
