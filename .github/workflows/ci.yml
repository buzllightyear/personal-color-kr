# Minimal CI for the personal-color-kr pnpm monorepo.
#
# Scope (locked by the Seed for AC 3):
#   - One job, one runner: ubuntu-latest, Node 20.x, Python 3.12.
#   - Three checks: typecheck (core-ts + mobile), vitest (core-ts), pytest
#     (core-python). No lint, no coverage gating, no security scans,
#     no E2E, no deploy.
#   - Built-in caching only (actions/setup-node `cache: pnpm` and
#     actions/setup-python `cache: pip`). No custom cache layers.
#   - `.env`-gated tests are expected to skip themselves via
#     `describe.skipIf` / `pytest.mark.skipif`, so the workflow stays green
#     out-of-the-box on forks and clones that have no secrets.
name: CI

on:
  pull_request:
    branches: [main]
  push:

# Cancel in-progress runs for the same ref when a new push lands. Keeps
# us inside the 2,000 free private-repo minutes/month budget.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node 20 / Python 3.12)
    runs-on: ubuntu-latest
    # Postgres 16 service container — required by the apps/api integration
    # tier (AC3 /v1/db-health, AC14 alembic upgrade head) added in Phase 4.1.
    # Existing core-ts / mobile / core-python steps do not depend on it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pck
          POSTGRES_PASSWORD: pck_dev_only
          POSTGRES_DB: pck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pck"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # apps/api integration tier consumes DATABASE_URL_TEST; unit tier
      # (AC2/AC4/AC5–AC10/AC15/AC16) is in-memory and does not touch the DB.
      DATABASE_URL_TEST: postgresql+asyncpg://pck:pck_dev_only@127.0.0.1:5432/pck_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'packages/core-python/pyproject.toml'

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        # `pyproject.toml` only declares runtime deps (python-dotenv). We
        # install pytest separately since it is a CI-only requirement.
        # `-e` editable install wires `src/` onto sys.path so the test
        # suite can import the package without a build step.
        # apps/api adds pytest-asyncio (for the async http test client) and
        # is installed editable so the `api` package resolves on sys.path
        # for the apps/api tests below.
        # mypy is installed as a CI-only requirement so the Phase 4.2
        # `mypy --strict` gate (Sub-AC 9.2) can run against
        # `apps/api/src/` without forcing the runtime image to carry it.
        # ruff is installed as a CI-only requirement so the Phase 4.2
        # `ruff check` gate (Sub-AC 9.3) can run against `apps/api/{src,tests}`
        # without forcing the runtime image to carry it.
        # black is installed as a CI-only requirement so the Phase 4.2
        # `black --check` gate (Sub-AC 9.4) can run against
        # `apps/api/{src,tests}` without forcing the runtime image to carry
        # it. Config (target-version py312, line-length 88) lives in
        # `apps/api/pyproject.toml` under `[tool.black]`.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio mypy ruff black
          python -m pip install -e packages/core-python
          python -m pip install -e apps/api

      - name: Typecheck (core-ts)
        # Dedicated step so the core-ts typecheck has its own
        # pass/fail signal in the GitHub Actions UI. Invokes the
        # workspace `typecheck` script which runs `tsc --noEmit`
        # against `packages/core-ts/tsconfig.json` (no emit, no bundle).
        run: pnpm --filter core-ts run typecheck

      - name: Typecheck (mobile)
        # Mobile typecheck kept as a sibling step so a core-ts type
        # regression cannot mask a mobile-only regression (or vice versa).
        # Delegates to the workspace `typecheck` script
        # (`tsc --noEmit -p tsconfig.json`) so the command stays a
        # single source of truth in `apps/mobile/package.json`.
        # Non-zero exit from `tsc` fails this step (and the job),
        # yielding a discrete pass/fail signal in the Actions UI.
        run: pnpm --filter mobile run typecheck

      - name: Run vitest (core-ts)
        run: pnpm --filter core-ts run test

      - name: Run vitest (mobile)
        # Mobile vitest covers the PostHogProvider singleton, vendor-keys
        # accessor, and app.config dotenv loading paths. Kept as a sibling
        # step so CI logs surface the 2 .env-gated mobile skips alongside
        # the core-ts and core-python skips (1 + 2 + 3 = 6 total per the
        # Seed AC 8 "skipped_test_count: 6" expectation).
        run: pnpm --filter mobile run test

      - name: Format check (core-ts + mobile, prettier --check)
        # Phase 6.4: hard-blocking TS/TSX format gate, the JS-side analogue of
        # the apps/api `black --check` gate. Prettier owns formatting
        # EXCLUSIVELY (ESLint defers all stylistic rules to it via
        # `eslint-config-prettier`). Configuration is a single root
        # `.prettierrc.json` (printWidth 88 to match `[tool.black] line-length`)
        # shared by both TS workspaces. `pnpm -r run format:check` fans out to
        # each workspace's `format:check` script (`prettier --check ...`),
        # which exits non-zero (failing this step AND the job — no
        # `continue-on-error`) the moment any file would be reformatted.
        # Runs before ESLint so a pure formatting drift surfaces on its own
        # signal rather than as lint noise.
        run: pnpm -r run format:check

      - name: Lint (core-ts + mobile, eslint)
        # Phase 6.4: hard-blocking TS/TSX lint gate, the JS-side analogue of
        # the apps/api `ruff check` + `mypy --strict` gates. ESLint owns
        # bug-catching EXCLUSIVELY: typescript-eslint's syntax-only
        # `recommended` base across src + tests, plus four cherry-picked
        # type-aware rules (no-floating-promises, no-misused-promises,
        # await-thenable, no-unnecessary-type-assertion) scoped to production
        # `src`/`app` only — mirroring how `mypy --strict` targets `src` alone.
        # `pnpm -r run lint` fans out to each workspace's `lint` script; a
        # non-zero exit fails this step AND the job (no `continue-on-error`),
        # giving the lint a discrete pass/fail signal in the Actions UI.
        run: pnpm -r run lint

      - name: Run pytest (core-python)
        working-directory: packages/core-python
        run: python -m pytest -q

      - name: Format check (apps/api, black --check)
        # Phase 4.2 Sub-AC 9.4: 4중 정합 CI gate requires `black --check`
        # against the apps/api source + tests trees. The formatter
        # configuration lives in `apps/api/pyproject.toml`
        # (`[tool.black] target-version = ["py312"]`, `line-length = 88`)
        # so the CLI invocation only needs to point at the package roots.
        # `--check` exits non-zero (and fails the step + the job) when any
        # file would be reformatted, giving the formatter a discrete
        # pass/fail signal in the Actions UI alongside the ruff / mypy /
        # pytest gates. Black runs before ruff so a formatting regression
        # surfaces before the lint/typecheck noise it can mask.
        working-directory: apps/api
        run: python -m black --check src tests

      - name: Lint (apps/api, ruff check)
        # Phase 4.2 Sub-AC 9.3: 4중 정합 CI gate requires `ruff check` against
        # the apps/api source + tests trees. The lint configuration lives in
        # `apps/api/pyproject.toml` (`[tool.ruff.lint] select = ["E","F","W"]`,
        # `ignore = ["E501"]`) so the CLI invocation only needs to point at
        # the package roots. A non-zero exit fails this step (and the job),
        # giving the lint a discrete pass/fail signal in the Actions UI
        # alongside the mypy / pytest / vitest gates.
        working-directory: apps/api
        run: python -m ruff check src tests

      - name: Typecheck (apps/api, mypy --strict)
        # Phase 4.2 Sub-AC 9.2: 4중 정합 CI gate requires `mypy --strict`
        # against the apps/api source tree. The strict configuration lives
        # in `apps/api/pyproject.toml` (`[tool.mypy] strict = true`,
        # `files = ["src"]`) so the CLI invocation only needs to point at
        # the package root. A non-zero exit fails this step (and the job),
        # giving the typecheck a discrete pass/fail signal in the Actions
        # UI alongside the existing core-ts / mobile typechecks.
        working-directory: apps/api
        run: python -m mypy --strict src

      - name: Alembic upgrade head (apps/api)
        # AC14 verifies the empty baseline migration applies cleanly against
        # a fresh Postgres 16. Runs after Python deps install so alembic is
        # available, and before apps/api pytest so the integration tier has
        # a migrated schema (currently empty — Phase 4.2 adds tables).
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+asyncpg://pck:pck_dev_only@127.0.0.1:5432/pck_test
        run: alembic -c alembic.ini upgrade head

      - name: Run pytest (apps/api)
        # Runs the apps/api unit + integration tiers. The integration tier
        # (marked `@pytest.mark.integration`) hits the postgres:16 service
        # via DATABASE_URL_TEST; the unit tier exercises the FastAPI app
        # in-memory through httpx.AsyncClient + ASGITransport with
        # `app.dependency_overrides` stubbing the diagnose callable.
        working-directory: apps/api
        run: python -m pytest -q
