[project]
name = "api"
version = "0.1.0"
description = "FastAPI HTTP surface for personal-color-kr (Phase 4.1 — three /v1/ endpoints over local Postgres 16)."
requires-python = ">=3.12"
dependencies = [
    # FastAPI is the HTTP framework; constructed once in apps/api/src/api/main.py.
    "fastapi",
    # Uvicorn[standard] is the ASGI server used by the local dev command and the
    # docker-compose smoke (`uvicorn api.main:app --host 127.0.0.1 --port 8000`).
    "uvicorn[standard]",
    # SQLAlchemy 2.0 async engine + AsyncSession power the single DB import
    # boundary inside `apps/api/src/api/db/`. The `[asyncio]` extra is required
    # for the async runtime; pinned at >=2.0 so the new declarative API is
    # available.
    "sqlalchemy[asyncio]>=2.0",
    # asyncpg is the async PostgreSQL driver consumed via the
    # `postgresql+asyncpg://` URL scheme; no synchronous psycopg2 fallback.
    "asyncpg",
    # Alembic manages the migration chain; the empty baseline migration lives
    # in `apps/api/src/api/db/migrations/versions/` and is the only migration
    # in Phase 4.1.
    "alembic",
    # python-dotenv loads the Phase 1.2 root `.env` via `find_dotenv()` so the
    # FastAPI process resolves `DATABASE_URL` without hardcoding values.
    "python-dotenv",
    # Pydantic v2 powers the single `DiagnoseResponse` response_model that
    # serializes the 9-field DiagnosisResult dataclass at the HTTP boundary.
    "pydantic>=2",
    # python-multipart is the FastAPI dependency that parses
    # `multipart/form-data` bodies for the selfie upload field.
    "python-multipart",
    # PyJWT[crypto] (Phase 4.3 Apple Sign In) is required for two
    # cryptographic operations on the auth boundary:
    #   1. Verifying Apple-issued ID tokens (RS256 signature against
    #      Apple's JWKS at https://appleid.apple.com/auth/keys) inside
    #      POST /v1/auth/sign-in-with-apple. PyJWT's `[crypto]` extra
    #      pulls in `cryptography`, which is what powers the RSA public
    #      key verification path; without it, PyJWT raises
    #      `PyJWTError: Algorithm 'RS256' could not be found` on the
    #      Apple token's signature check.
    #   2. Issuing the backend's own stateless HS256 session token
    #      (sub=users.id, 24h TTL, claims iss/aud/iat/exp/jti), signed
    #      with the JWT_SECRET env var, and verified on every
    #      POST /v1/diagnose request via the require_current_user
    #      dependency. HS256 verification does not technically require
    #      the `[crypto]` extra, but pinning the extra keeps a single
    #      dependency line covering both algorithms and matches how the
    #      FastAPI/Apple-auth ecosystem documents the install.
    # This is NOT supabase-py / firebase-admin / authlib — Phase 4.3 is
    # explicitly self-managed Apple Sign In (no Supabase SDK, no Firebase
    # SDK, no third-party identity broker). PyJWT is the minimum surface
    # area to validate Apple's JWT and mint our own.
    "PyJWT[crypto]",
    # sentry-sdk[fastapi] (Phase 7.2 launch-readiness gate) provides
    # full-stack error observability for the API layer: unhandled-exception
    # capture, environment-aware DSN initialization, PII scrubbing via a
    # `before_send` hook, and request_id correlation. The `[fastapi]` extra
    # pulls in the Starlette/FastAPI integration hooks Sentry uses to
    # auto-instrument the ASGI request lifecycle for error capture. Pinned to
    # the 2.x major (latest stable as of 2026-06) so the modern
    # `sentry_sdk.init(...)` API and `before_send` contract stay stable.
    # NOTE (Phase 7.2 scope): error capture only — no performance/transaction
    # tracing (traces_sample_rate stays 0, no SentryAsgiMiddleware) and
    # send_default_pii is forced False. Mobile @sentry/react-native is
    # explicitly deferred to Phase 7.2b/7.3.
    "sentry-sdk[fastapi]>=2,<3",
    # NOTE: `core-python` (Phase 3.2 diagnose pipeline) is NOT a runtime
    # dependency here. PEP 508 relative `file://` URLs are not portable
    # (pip rejects them as "non-local file URI") and `mediapipe==0.10.18`
    # lacks a Python 3.13 wheel, so locking it transitively breaks local
    # dev on 3.13 (Phase 3.2 documents the same constraint). CI and local
    # dev install both editably in order:
    #     pip install -e packages/core-python && pip install -e apps/api
    # The `from personal_color.* import ...` calls resolve at runtime
    # because core-python is installed into the same site-packages.
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "unit: fast, no I/O",
    "integration: cross-module / external I/O (real Postgres, real MediaPipe, real Pillow)",
]

[tool.black]
# Match the Phase 0.x `[tool.black] target-version` so the same Python 3.12
# CI runner formats both packages consistently.
target-version = ["py312"]
# Pin the line-length to the same 88-column default used by `[tool.ruff]`
# below so the formatter (black) and linter (ruff) cannot disagree on
# wrap thresholds. The CI gate (Sub-AC 9.4 / 4중 정합) invokes
# `python -m black --check src tests` from `apps/api/`, picking this
# config up via pyproject discovery.
line-length = 88

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

# `personal_color` is installed as an editable path dep but does not yet
# ship a PEP 561 `py.typed` marker. The package is fully type-annotated, but
# mypy --strict refuses to follow untyped third-party packages by default.
# The override below tells mypy to trust the inline annotations of the
# `personal_color` sub-package (where DiagnosisResult / Season / Tone /
# Contrast live and are consumed by `api.schemas.diagnose`).
[[tool.mypy.overrides]]
module = ["personal_color.*"]
ignore_missing_imports = true
follow_imports = "silent"

# `retention` is the core-python package hosting the pure, HTTP-ignorant
# 30-day retention handler (`retention.api.get_retention_metrics`) consumed
# by `api.routers.metrics` in Phase 4.4. Like `personal_color`, it is an
# editable path dep without a PEP 561 `py.typed` marker, so mypy --strict
# would otherwise refuse to follow it. The override trusts its inline
# annotations (the handler returns an untyped `dict` envelope by design).
[[tool.mypy.overrides]]
module = ["retention.*"]
ignore_missing_imports = true
follow_imports = "silent"

[tool.ruff]
# Match the Phase 0.x / Phase 4.x `target-version = "py312"` so ruff lints
# against the same Python the CI runner uses (see `.github/workflows/ci.yml`).
target-version = "py312"
# `src` makes ruff treat `src/` and `tests/` as first-party for isort-style
# import grouping and resolves `from api.*` imports without false-positive
# `unknown-third-party` confusion. Kept here even when `I` is not in the
# active lint select so future Sub-AC additions get the same root layout.
src = ["src", "tests"]
# Black handles formatting (88-col default in `[tool.black]`); ruff acts as
# the lint gate. We share the same line-length so `ruff format` (if ever
# enabled) and `black` cannot disagree.
line-length = 88

[tool.ruff.lint]
# Phase 4.2 Sub-AC 3: the apps/api lint target must pass with **zero
# violations in CI**. The selected rule families are the conservative set
# that already passes on the existing Phase 4.1 + Phase 4.2 source/test
# trees without retroactively rewriting Phase 4.1 code:
#
#   * `E` — pycodestyle errors (real-bug-class issues: bad indentation,
#     mis-paired brackets, etc.). E501 (line-too-long) is delegated to
#     black per the `ignore` list below.
#   * `F` — pyflakes (undefined names, unused imports, shadowed builtins).
#   * `W` — pycodestyle warnings (trailing whitespace, invalid escape
#     sequences, etc.).
#
# Additional families (`I` isort, `B` bugbear, `UP` pyupgrade, etc.) are
# intentionally left for later sub-ACs so this gate stays green without
# coupling to a separate refactor PR.
select = ["E", "F", "W"]
ignore = [
    # E501 (line-too-long) is owned by black (`[tool.black] line-length`
    # defaults to 88). A handful of long async test-function signatures
    # like `async def test_..._with_six_columns_of_correct_types() -> (`
    # cannot be broken further by black, so ruff must not double-flag
    # them here. Disabling E501 keeps the CI lint gate signal exclusive
    # to logic/style issues that black does not auto-format away.
    "E501",
]
