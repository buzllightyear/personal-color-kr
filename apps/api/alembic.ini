# Alembic configuration for the apps/api FastAPI workspace (Phase 4.1).
#
# This is the SINGLE alembic config file in the repository. The migration
# chain lives under apps/api/src/api/db/migrations/ (env.py + versions/).
# The empty baseline migration (down_revision = None, no-op upgrade/downgrade)
# establishes the chain so Phase 4.2+ can extend without re-doing setup.
#
# The DATABASE_URL value is resolved at runtime by env.py via python-dotenv +
# `find_dotenv()` against the Phase 1.2 root `.env`, so it is intentionally
# blank here. CI overrides via DATABASE_URL_TEST; docker-compose smoke uses
# the local DATABASE_URL value. Never hardcode credentials in this file.

[alembic]
# Path to migration scripts, relative to the directory containing this file
# (i.e. apps/api/). The script_location lives inside the package so the
# alembic boundary stays a sibling of the SQLAlchemy boundary.
script_location = src/api/db/migrations

# Use a deterministic file template so the baseline migration revision id
# is stable and reviewable.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# `prepend_sys_path` ensures the `api` package is importable inside env.py
# (so env.py can reuse the same DATABASE_URL resolver as the FastAPI app).
prepend_sys_path = src

# Timezone for migration filename timestamps.
timezone = UTC

# sqlalchemy.url is populated at runtime inside env.py from the Phase 1.2
# root `.env` (DATABASE_URL). Leaving this blank is intentional — alembic
# will read the URL from the environment loader, not from this file.
sqlalchemy.url =


[post_write_hooks]
# Phase 4.1 ships with a single empty baseline migration; no post-write
# hooks are configured. Black formatting of migration files is left to the
# global `[tool.black]` configuration in apps/api/pyproject.toml.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
