<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Season result swatch</title>
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <style>
      :root {
        --ink-primary: #1a1a1a;
        --ink-muted: #8a8a8a;
        --ink-line: #e8e8e8;
        --ink-wash: #f4f4f4;
        --ink-paper: #ffffff;
        --font: 'Pretendard', -apple-system, system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 32px; background: var(--ink-paper);
        color: var(--ink-primary); font-family: var(--font); -webkit-font-smoothing: antialiased;
      }
      .eyebrow { font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 4px; }
      .title { font-weight: 300; font-size: 24px; letter-spacing: -0.01em; margin: 0 0 4px; }
      .note { font-size: 13px; color: var(--ink-muted); margin: 0 0 28px; max-width: 50ch; }
      /* The result card: monochrome chrome + a single season chip = the payoff. */
      .result {
        border: 1px solid var(--ink-line); border-radius: 2px; padding: 24px;
        display: flex; align-items: center; gap: 20px; max-width: 460px;
      }
      .chip { width: 84px; height: 84px; border-radius: 2px; flex: 0 0 auto; background: #c9925e; }
      .meta__eyebrow { font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 6px; }
      .meta__title { font-weight: 300; font-size: 26px; letter-spacing: -0.01em; margin: 0 0 6px; }
      .meta__sub { font-size: 13px; color: var(--ink-muted); margin: 0; }
    </style>
  </head>
  <body>
    <p class="eyebrow">Components</p>
    <h1 class="title">Season result swatch</h1>
    <p class="note">
      The one place color appears. Everything around it stays monochrome so the
      diagnosed swatch reads as the payoff.
    </p>
    <div class="result">
      <div class="chip"></div>
      <div class="meta">
        <p class="meta__eyebrow">Your category</p>
        <p class="meta__title">가을 웜톤</p>
        <p class="meta__sub">따뜻하고 깊은 톤 · autumn warm</p>
      </div>
    </div>
  </body>
</html>
